[newrelic]
; Keep license_key and app_name out of this tracked file. New Relic gives
; config-file values precedence over environment variables, so these core
; settings must be supplied at runtime with NEW_RELIC_LICENSE_KEY and
; NEW_RELIC_APP_NAME.
monitor_mode = true
high_security = false
distributed_tracing.enabled = true
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
error_collector.enabled = true
browser_monitoring.auto_instrument = false
logging.enabled = true
log_file = stderr
log_level = info
