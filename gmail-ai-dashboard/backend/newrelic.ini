[newrelic]
; Keep the license key out of source control. The agent reads
; NEW_RELIC_LICENSE_KEY from the deployment environment.
license_key =
app_name = Gmail AI Dashboard
monitor_mode = true
high_security = false
distributed_tracing.enabled = true
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
error_collector.enabled = true
browser_monitoring.auto_instrument = false
logging.enabled = true
log_file = stderr
log_level = info
