name: VC11 CI/CD

on:
  pull_request:
    branches: [heroku_deploy_dev_lg]
  push:
    branches: [heroku_deploy_dev_lg]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the complete workflow on each branch to preserve deployment order.
concurrency:
  group: vc11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: "sqlite:///:memory:"
      SESSION_SECRET: "ci-only-session-secret-never-use-in-production-2026"
      DEVELOPER_SETTINGS_ENCRYPTION_KEY: "ci-only-encryption-key-never-use-in-production-2026"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gmail-ai-dashboard/backend/requirements-heroku.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gmail-ai-dashboard/backend/requirements-heroku.txt pytest httpx
      - name: Run all backend test directories
        run: >-
          python -m pytest tests gmail-ai-dashboard/tests
          gmail-ai-dashboard/backend/tests -q --junitxml=test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gmail-ai-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gmail-ai-dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container:
    name: Production Docker build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build root production Dockerfile
        run: docker build --tag vc11:${{ github.sha }} .

  deploy:
    name: Deploy to Heroku
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/heroku_deploy_dev_lg'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HEROKU_APP_NAME: ai-powered-gmail
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy tested commit through Heroku Git
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "Configure HEROKU_API_KEY in the production environment or repository secrets."
            exit 1
          fi
          credential_dir=$(mktemp -d)
          trap 'rm -rf "$credential_dir"' EXIT
          umask 077
          account_status=$(curl --silent --show-error --output "$credential_dir/account.json" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header 'Accept: application/vnd.heroku+json; version=3' \
            --header "Authorization: Bearer $HEROKU_API_KEY" \
            https://api.heroku.com/account) || {
              echo "Could not reach the Heroku API to verify HEROKU_API_KEY."
              exit 1
            }
          if [ "$account_status" != 200 ]; then
            echo "HEROKU_API_KEY was rejected by the Heroku API (HTTP $account_status). Check that the production secret is a current Heroku API token."
            exit 1
          fi
          heroku_email=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["email"])' "$credential_dir/account.json")
          app_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header 'Accept: application/vnd.heroku+json; version=3' \
            --header "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME") || {
              echo "Could not reach the Heroku API to verify app access."
              exit 1
            }
          if [ "$app_status" != 200 ]; then
            echo "The HEROKU_API_KEY account cannot access $HEROKU_APP_NAME (HTTP $app_status). Check the app name and deployer permissions."
            exit 1
          fi
          cat > "$credential_dir/askpass" <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$HEROKU_EMAIL" ;;
            *Password*) printf '%s\n' "$HEROKU_API_KEY" ;;
            *) exit 1 ;;
          esac
          SCRIPT
          chmod 700 "$credential_dir/askpass"
          HEROKU_EMAIL="$heroku_email" GIT_ASKPASS="$credential_dir/askpass" GIT_TERMINAL_PROMPT=0 git push \
            "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:refs/heads/main
      - name: Check application health
        env:
          HEROKU_HEALTH_URL: ${{ vars.HEROKU_HEALTH_URL || 'https://ai-powered-gmail-0007703734bc.herokuapp.com/health' }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" "$HEROKU_HEALTH_URL"
          python3 - "$response_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)
          if not isinstance(payload, dict) or payload.get("status") != "ok":
              raise SystemExit("Heroku health response did not report status=ok")
          print("Heroku application is healthy")
          PY

